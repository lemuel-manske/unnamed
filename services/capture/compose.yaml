services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2

    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"

    ports:
      - "8000:8000"

  rabbitmq:
    image: rabbitmq:4.1-management

    environment:
      RABBITMQ_DEFAULT_USER: castellani
      RABBITMQ_DEFAULT_PASS: castellani

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rabbitmq-data:
